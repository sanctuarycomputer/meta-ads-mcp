name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Install ffmpeg (video keyframe tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Test
        env:
          CI: '1'
          FFMPEG_REQUIRED: '1'
        run: npm test

      - name: Build
        run: npm run build

  secret-scan:
    name: gitleaks (secret scan)
    # Required check, so it always runs and always reports a status. It uses
    # the gitleaks binary itself, pinned by version (.gitleaks-version) and by
    # the release tarball's sha256, as stacksbot's CI and Docker image do.
    # The upstream gitleaks GitHub Action needed an org licence secret and
    # failed without one; the binary needs no secret, so fork PRs scan too.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, the value stacksbot's
      # Dockerfile pins. Bumping .gitleaks-version without updating this hash
      # fails the checksum below, loudly.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          fetch-depth: 0

      # Single source of truth for the scanner version, shared with the local
      # guard in .github/pre-deploy-guard/.
      - name: Resolve pinned gitleaks version
        run: |
          version="$(tr -d '[:space:]' < .gitleaks-version)"
          # .gitleaks-version is checked-out repo content, so treat it as
          # untrusted before it reaches GITHUB_ENV or a URL: anything but a
          # bare x.y.z could smuggle extra variables into the job environment.
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::.gitleaks-version must contain a bare semver (got: $version)"
            exit 1
          fi
          echo "GITLEAKS_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      # Every commit reachable from the checked-out ref: the PR's merge commit
      # on a pull request, main on push. Other branches can't turn this red.
      - name: Run gitleaks
        run: |
          set -euo pipefail
          gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts=HEAD .
